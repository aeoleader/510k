<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1d19">
  <title>五十K</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- full screen when opened from the home screen (iOS), and in Chinese Android browsers that honour these hints -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="五十K">
  <meta name="x5-fullscreen" content="true">
  <meta name="full-screen" content="yes">
  <meta name="browsermode" content="application">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="wordmark">五十<b>K</b></span>
    <button id="roomBadge" type="button" class="room-code" title="复制邀请链接" hidden></button>
    <span id="connection" class="connection" role="status" hidden>重新连接中…</span>
    <div id="scoreboard" class="scoreboard" hidden></div>
    <span id="accountChip" class="account-chip" hidden></span>
    <button id="pauseBtn" type="button" class="btn btn-ghost pause-btn" title="暂停游戏" aria-label="暂停游戏" hidden><span aria-hidden="true">❚❚</span><span class="long"> 暂停</span></button>
    <button id="rotateBtn" type="button" class="btn btn-ghost rotate-btn" hidden>横屏</button>
    <a class="rules-link" href="/rules.html" target="_blank" rel="noopener">规则</a>
  </header>

  <main id="entryView" class="entry">
    <div class="entry-intro">
      <h1 class="entry-title">五十<b>K</b></h1>
      <p class="entry-lede">4 到 8 人的抢分纸牌。队友隔位而坐，一起把 5、10、K 收进自己队里。</p>
      <ul class="entry-points">
        <li><span class="pip">5</span>5 分</li>
        <li><span class="pip">10</span>10 分</li>
        <li><span class="pip">K</span>10 分</li>
      </ul>
    </div>
    <form id="entryForm" class="entry-card" autocomplete="off">
      <div id="inviteBanner" class="invite-banner" hidden></div>
      <div id="accountPanel"></div>
      <button id="createBtn" type="button" class="btn btn-primary btn-block">创建房间</button>
      <div class="divider"><span>或加入朋友的房间</span></div>
      <label class="field" for="codeInput">房间码</label>
      <div class="join-row">
        <input id="codeInput" maxlength="4" autocapitalize="characters" spellcheck="false">
        <button id="joinBtn" type="button" class="btn">加入</button>
      </div>
      <a class="entry-rules" href="/rules.html" target="_blank" rel="noopener">第一次玩？看看规则</a>
    </form>
  </main>

  <main id="lobbyView" class="lobby" hidden></main>

  <main id="tableView" class="game" hidden>
    <section class="felt-wrap" aria-label="牌桌">
      <div class="felt">
        <div id="centerArea" class="center-area"></div>
        <ol id="logTicker" class="log-ticker" aria-live="polite"></ol>
      </div>
      <div id="seats" class="seats"></div>
      <div id="fx" class="fx-layer" aria-hidden="true"></div>
      <aside id="counterPanel" class="counter" aria-label="记牌器" hidden></aside>
      <div class="table-tools">
        <button id="playLogBtn" type="button" class="btn tool-btn" aria-expanded="false" aria-controls="playLog">出牌记录</button>
        <button id="soundBtn" type="button" class="btn tool-btn" aria-pressed="true">声音：开</button>
      </div>
      <aside id="playLog" class="play-log" aria-label="本局出牌记录" hidden></aside>
    </section>
    <section class="dock" aria-label="我的手牌">
      <div id="actionBar" class="action-bar"></div>
      <div id="quickPicks" class="quick-picks" aria-label="快捷推荐"></div>
      <div id="handArea" class="hand"></div>
    </section>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
